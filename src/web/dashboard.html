<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CardGuard — Ledger</title>
  <meta name="description" content="Every mandate the agent holds — pending approvals, live checkouts, and settled purchases, with full audit." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="/tokens.css" />
  <style>
    /*
      The Ledger is a manager's operating table, not a receipts feed. It wears
      the Request page's clothes — ink navy, one iris accent, amber for limits,
      Space Grotesk over Inter over JetBrains Mono — but it behaves like a
      console: a row is a glance, a drawer is the whole file.

      Two interactions, deliberately different. A purchase awaiting a human is
      the manager's job, so it wears its Approve / Reject buttons on its sleeve —
      just those two, nothing else inline. Everything else opens a right-hand
      drawer with the entire dossier: decisions, policy, credential, timeline,
      execution, replay, merchant, raw metadata. Compact to read, deep on demand.
    */

    :root {
      --ink:        #1A1F36;
      --ink-2:      #4A5170;
      --ink-3:      #6B7394;
      --ink-4:      #9AA0BC;
      --line:       #E6E8F0;
      --line-soft:  #F0F1F6;
      --canvas:     #FCFCFD;
      --raise:      #FFFFFF;

      --iris:       #5B54E8;
      --iris-ink:   #4740C4;
      --iris-wash:  #F1F0FE;
      --iris-line:  #DEDCFB;

      --limit:      #B4530A;
      --go:         #0E7C66;
      --stop:       #B23A48;

      --s-green-t:  #0E7C66;  --s-green-row: #F4FAF7;  --s-green-mono: #E4F1EB;
      --s-amber-t:  #B4530A;  --s-amber-row: #FCF7F1;  --s-amber-mono: #F6E9DA;
      --s-iris-t:   #4740C4;  --s-iris-row:  #F6F5FE;  --s-iris-mono:  #E9E7FC;
      --s-red-t:    #B23A48;  --s-red-row:   #FCF5F6;  --s-red-mono:   #F5E1E4;
      --s-gray-t:   #6B7394;  --s-gray-row:  #FAFAFC;  --s-gray-mono:  #EEEFF4;

      --r-lg: 16px; --r-md: 13px; --r-sm: 9px;
      --shadow-drawer: -20px 0 60px -24px rgba(26,31,54,.32);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--canvas); color: var(--ink);
      line-height: 1.55; -webkit-font-smoothing: antialiased; min-height: 100vh;
    }
    ::selection { background: var(--iris-wash); }

    header {
      height: 60px; padding: 0 28px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--line-soft);
      position: sticky; top: 0; background: rgba(252,252,253,.82);
      backdrop-filter: saturate(180%) blur(12px); z-index: 30;
    }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
    .brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--ink); color: #fff; display: grid; place-items: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px; }
    .brand-name { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
    .nav { display: flex; gap: 4px; }
    .nav a { font-size: 13px; font-weight: 450; color: var(--ink-3); text-decoration: none; padding: 6px 12px; border-radius: 7px; transition: color .15s, background .15s; }
    .nav a:hover { color: var(--ink); background: var(--line-soft); }
    .nav a.here { color: var(--iris-ink); background: var(--iris-wash); font-weight: 500; }

    main { max-width: 780px; margin: 0 auto; padding: 52px 24px 120px; }

    .hero { margin-bottom: 26px; }
    .hero h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: clamp(28px, 4.5vw, 38px); letter-spacing: -.03em; color: var(--ink); opacity: 0; animation: rise .55s .04s ease forwards; }
    .summary { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 12px; margin-top: 12px; font-size: 14px; color: var(--ink-3); opacity: 0; animation: rise .55s .1s ease forwards; }
    /* pending is the manager's action item — it leads, and it is loud */
    .pending-flag { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; padding: 6px 13px; border-radius: 20px; background: var(--s-amber-row); color: var(--limit); border: 1px solid #F0DDC6; }
    .pending-flag .n { font-family: 'JetBrains Mono', monospace; font-size: 15px; }
    .pending-flag.clear { background: var(--s-green-row); color: var(--go); border-color: #BFE0D6; }
    .pending-flag .ring { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: blink 1.4s ease-in-out infinite; }
    .pending-flag.clear .ring { animation: none; }
    .summary .stat b { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--ink-2); }
    .summary .sep { color: var(--ink-4); }

    .search { margin-top: 20px; position: relative; opacity: 0; animation: rise .55s .16s ease forwards; }
    .search svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--ink-4); }
    .search input { width: 100%; height: 46px; padding: 0 16px 0 42px; border: 1px solid var(--line); border-radius: 12px; background: var(--raise); font-family: inherit; font-size: 15px; color: var(--ink); transition: border-color .2s, box-shadow .2s; }
    .search input::placeholder { color: var(--ink-4); }
    .search input:focus { outline: 0; border-color: var(--iris-line); box-shadow: 0 0 0 4px var(--iris-wash); }

    .err { margin-top: 16px; background: var(--s-red-row); border: 1px solid #F1D3D7; color: #8A2733; border-radius: var(--r-md); padding: 12px 15px; font-size: 13.5px; display: none; }
    .err.show { display: block; }

    .list { margin-top: 24px; display: flex; flex-direction: column; gap: 6px; }

    .row { border-radius: var(--r-lg); background: var(--s-gray-row); cursor: pointer; transition: background .2s ease, box-shadow .2s ease; opacity: 0; animation: rise .4s ease forwards; }
    .row:hover { background: var(--raise); box-shadow: 0 1px 2px rgba(26,31,54,.05), 0 8px 22px -14px rgba(26,31,54,.18); }
    .row.s-green { background: var(--s-green-row); } .row.s-amber { background: var(--s-amber-row); }
    .row.s-iris  { background: var(--s-iris-row); }  .row.s-red   { background: var(--s-red-row); }
    .row.s-gray  { background: var(--s-gray-row); }
    .row:hover.s-green, .row:hover.s-amber, .row:hover.s-iris, .row:hover.s-red, .row:hover.s-gray { background: var(--raise); }

    .rhead { display: flex; align-items: center; gap: 15px; padding: 15px 18px; }
    .mono-tile { width: 42px; height: 42px; border-radius: 11px; flex-shrink: 0; display: grid; place-items: center; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 17px; background: var(--s-gray-mono); color: var(--s-gray-t); }
    .s-green .mono-tile { background: var(--s-green-mono); color: var(--s-green-t); }
    .s-amber .mono-tile { background: var(--s-amber-mono); color: var(--s-amber-t); }
    .s-iris  .mono-tile { background: var(--s-iris-mono);  color: var(--s-iris-t); }
    .s-red   .mono-tile { background: var(--s-red-mono);   color: var(--s-red-t); }
    .s-gray  .mono-tile { background: var(--s-gray-mono);  color: var(--s-gray-t); }

    .rmid { flex: 1; min-width: 0; }
    .rmerchant { font-size: 15px; font-weight: 600; color: var(--ink); letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
    .rmerchant .sim { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500; color: var(--ink-4); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
    .rpurpose { font-size: 13px; color: var(--ink-3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rright { text-align: right; flex-shrink: 0; }
    .ramt { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
    /* status: dot + descriptive text */
    .rstat { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; margin-top: 4px; white-space: nowrap; }
    .rstat .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--s-gray-t); }
    .rstat .word { font-weight: 600; color: var(--s-gray-t); }
    .rstat .time { color: var(--ink-4); font-weight: 400; }
    .s-green .rstat .dot { background: var(--s-green-t); } .s-green .rstat .word { color: var(--s-green-t); }
    .s-amber .rstat .dot { background: var(--s-amber-t); } .s-amber .rstat .word { color: var(--s-amber-t); }
    .s-iris  .rstat .dot { background: var(--s-iris-t); }  .s-iris  .rstat .word { color: var(--s-iris-t); }
    .s-red   .rstat .dot { background: var(--s-red-t); }   .s-red   .rstat .word { color: var(--s-red-t); }
    .s-gray  .rstat .dot { background: var(--s-gray-t); }  .s-gray  .rstat .word { color: var(--s-gray-t); }
    .rstat .dot.pulse { animation: blink 1.3s ease-in-out infinite; }

    /* pending-only inline: just the two actions, nothing else */
    .approve-inline { display: none; padding: 0 18px 15px 75px; }
    .row.s-amber .approve-inline { display: block; animation: openBody .3s ease; }
    .approve-inline .why { font-size: 12.5px; color: var(--ink-2); margin-bottom: 11px; line-height: 1.45; }
    .approve-acts { display: flex; gap: 10px; }
    .btn { font-family: inherit; font-size: 13.5px; font-weight: 550; cursor: pointer; border-radius: var(--r-sm); padding: 9px 18px; border: 1px solid transparent; transition: background .15s, border-color .15s, color .15s, transform .1s; display: inline-flex; align-items: center; gap: 7px; }
    .btn:active { transform: scale(.97); } .btn:disabled { opacity: .6; cursor: default; }
    .btn-go { background: var(--ink); color: #fff; } .btn-go:hover:not(:disabled) { background: var(--iris-ink); }
    .btn-danger { background: transparent; border-color: #E9C3C8; color: var(--stop); } .btn-danger:hover:not(:disabled) { background: var(--s-red-row); }
    .btn-ghost { background: transparent; border-color: var(--line); color: var(--ink-2); } .btn-ghost:hover:not(:disabled) { border-color: var(--iris-line); color: var(--iris-ink); }
    .btn-kill { background: transparent; border-color: #E9C3C8; color: var(--stop); } .btn-kill:hover:not(:disabled) { background: var(--s-red-row); }

    /* ===================== drawer ===================== */
    .scrim { position: fixed; inset: 0; background: rgba(26,31,54,.28); opacity: 0; pointer-events: none; transition: opacity .28s ease; z-index: 40; backdrop-filter: blur(1px); }
    .scrim.open { opacity: 1; pointer-events: auto; }
    .drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(460px, 100vw); background: var(--raise); box-shadow: var(--shadow-drawer); transform: translateX(100%); transition: transform .32s cubic-bezier(.4,0,.2,1); z-index: 41; display: flex; flex-direction: column; }
    .drawer.open { transform: none; }
    .drawer-head { flex-shrink: 0; padding: 18px 22px; border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; gap: 11px; }
    .drawer-head .d-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .d-merchant { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 16px; color: var(--ink); }
    .d-state { font-size: 12px; font-weight: 600; }
    .d-id { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--ink-4); margin-left: auto; }
    .d-close { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--raise); color: var(--ink-3); cursor: pointer; display: grid; place-items: center; font-size: 15px; transition: border-color .15s, color .15s; flex-shrink: 0; }
    .d-close:hover { border-color: var(--stop); color: var(--stop); }
    .drawer-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 20px 22px 40px; }

    .d-hero { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin-bottom: 6px; }
    .d-amt { font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 30px; letter-spacing: -.02em; color: var(--ink); }
    .d-cadence { font-size: 12px; color: var(--ink-3); font-family: 'JetBrains Mono', monospace; }
    .d-purpose { font-size: 13.5px; color: var(--ink-2); margin-bottom: 18px; line-height: 1.5; }

    .sect { margin-top: 4px; border-top: 1px solid var(--line-soft); }
    .sect:first-of-type { border-top: 0; }
    .sect > h4 { font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--ink); padding: 16px 0 10px; }
    /* collapsible sections use native details for CSP-safety */
    details.sect > summary { list-style: none; cursor: pointer; font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 600; color: var(--ink); padding: 16px 0 10px; display: flex; align-items: center; gap: 8px; }
    details.sect > summary::-webkit-details-marker { display: none; }
    details.sect > summary .caret { font-size: 9px; color: var(--ink-4); transition: transform .2s; margin-left: auto; }
    details.sect[open] > summary .caret { transform: rotate(90deg); }
    details.sect > summary .count { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-4); font-weight: 500; }
    .sect-inner { padding-bottom: 16px; }

    .kv { display: flex; justify-content: space-between; gap: 16px; padding: 6px 0; font-size: 13px; }
    .kv dt { color: var(--ink-3); flex-shrink: 0; }
    .kv dd { color: var(--ink); text-align: right; word-break: break-word; }
    .kv dd.mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-variant-numeric: tabular-nums; }

    .lock { font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }
    .lock b { color: var(--ink); font-weight: 600; }
    .meter-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); margin: 8px 0 3px; }
    .meter-row b { font-family: 'JetBrains Mono', monospace; color: var(--ink-2); font-weight: 500; }
    .meter { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; margin-bottom: 6px; }
    .meter > i { display: block; height: 100%; border-radius: 3px; background: var(--iris); transition: width .5s ease; }
    .meter.settled > i { background: var(--go); } .meter.over > i { background: var(--stop); }
    .pips { display: inline-flex; gap: 3px; vertical-align: middle; }
    .pip { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
    .pip.spent { background: var(--ink-3); }

    .verdict { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12.5px; padding: 2px 9px; border-radius: 6px; }
    .verdict.auto { background: var(--s-green-row); color: var(--go); }
    .verdict.appr { background: var(--s-amber-row); color: var(--limit); }
    .verdict.stop { background: var(--s-red-row); color: var(--stop); }
    .risk { display: flex; align-items: center; gap: 8px; min-width: 120px; }
    .risk-bar { flex: 1; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
    .risk-bar > i { display: block; height: 100%; border-radius: 3px; }
    .risk-bar.low > i { background: var(--go); } .risk-bar.med > i { background: var(--limit); } .risk-bar.high > i { background: var(--stop); }
    .risk-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; }
    .risk.low .risk-label { color: var(--go); } .risk.med .risk-label { color: var(--limit); } .risk.high .risk-label { color: var(--stop); }

    .reasons { list-style: none; }
    .reasons li { position: relative; padding: 4px 0 4px 16px; font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
    .reasons li::before { content: '·'; position: absolute; left: 4px; color: var(--ink-4); font-weight: 700; }

    .manager { background: var(--s-amber-row); border: 1px solid #F0DDC6; border-radius: var(--r-md); padding: 15px 16px; margin: 14px 0; }
    .manager h5 { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; color: var(--limit); margin-bottom: 5px; }
    .manager p { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; margin-bottom: 13px; }

    .tl { list-style: none; }
    .tl li { position: relative; padding: 0 0 13px 18px; }
    .tl li::before { content: ''; position: absolute; left: 3px; top: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
    .tl li::after { content: ''; position: absolute; left: 6px; top: 12px; bottom: 0; width: 1px; background: var(--line-soft); }
    .tl li:last-child::after { display: none; }
    .tl li.good::before { background: var(--go); } .tl li.bad::before { background: var(--stop); } .tl li.key::before { background: var(--iris); }
    .tl-ev { font-size: 12.5px; color: var(--ink); font-weight: 450; }
    .tl-meta { font-size: 11px; color: var(--ink-4); font-family: 'JetBrains Mono', monospace; margin-top: 1px; }
    .tl-detail { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; line-height: 1.45; word-break: break-word; }

    .loglines { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; line-height: 1.7; color: var(--ink-2); background: var(--line-soft); border-radius: var(--r-sm); padding: 11px 13px; max-height: 220px; overflow-y: auto; overscroll-behavior: contain; }
    .loglines .ok { color: var(--go); } .loglines .fail { color: var(--stop); } .loglines .t { color: var(--ink-4); }
    .gateway { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-2); background: var(--line-soft); border-radius: var(--r-sm); padding: 10px 13px; word-break: break-word; line-height: 1.5; margin-top: 8px; }

    .replay-btn { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 550; color: var(--iris-ink); text-decoration: none; border: 1px solid var(--iris-line); background: var(--iris-wash); border-radius: var(--r-sm); padding: 9px 14px; transition: background .15s; }
    .replay-btn:hover { background: #E9E7FC; }
    .shots { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .shot { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-3); background: var(--line-soft); border-radius: 6px; padding: 4px 9px; }

    .thread { display: flex; flex-direction: column; gap: 9px; }
    .msg { max-width: 90%; } .msg.to-approver { align-self: flex-end; text-align: right; }
    .msg-meta { font-size: 10px; color: var(--ink-4); font-family: 'JetBrains Mono', monospace; margin-bottom: 3px; }
    .bubble { font-size: 12.5px; color: var(--ink); background: var(--line-soft); border-radius: 11px; padding: 8px 12px; line-height: 1.45; display: inline-block; text-align: left; }
    .msg.to-approver .bubble { background: var(--iris-wash); }
    .sim-note { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--ink-4); margin-bottom: 10px; }
    .sim-note .tag { font-family: 'JetBrains Mono', monospace; border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }

    .rawjson { font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.55; color: var(--ink-2); background: var(--line-soft); border-radius: var(--r-sm); padding: 11px 13px; white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow-y: auto; overscroll-behavior: contain; }

    .probe-out { margin-top: 10px; font-size: 12px; border-radius: var(--r-sm); padding: 10px 13px; line-height: 1.5; }
    .probe-out.blocked { background: var(--s-green-row); color: #0B5A4A; border: 1px solid #BFE0D6; }
    .probe-out.ran { background: var(--s-red-row); color: #8A2733; border: 1px solid #F1D3D7; }
    .probe-out b { font-weight: 600; }
    .dim { color: var(--ink-4); font-size: 12.5px; padding: 2px 0; }

    .empty { text-align: center; padding: 72px 24px; }
    .empty h2 { font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 19px; color: var(--ink-2); margin-bottom: 8px; }
    .empty p { font-size: 14px; color: var(--ink-4); }
    .empty a { color: var(--iris-ink); text-decoration: none; font-weight: 500; }


    /* ============ THE MANDATE CARD ============
       The credential as a physical object. It is minted (flips in), armed
       (a slow light sweep), stamped SPENT when used, striped when revoked.
       The scope is engraved on it: merchant lock, cap, live countdown.
       One object, whole story. */
    .mcard-wrap { perspective: 900px; margin: 2px 0 16px; }
    .mcard {
      position: relative; aspect-ratio: 1.586; max-width: 340px;
      border-radius: 14px; padding: 16px 18px; color: #EDEFFB;
      background: linear-gradient(128deg, #232A55 0%, #1A1F36 55%, #262E63 100%);
      box-shadow: 0 14px 30px -14px rgba(26,31,54,.5), inset 0 1px 0 rgba(255,255,255,.08);
      overflow: hidden; display: flex; flex-direction: column;
      animation: mint .7s cubic-bezier(.2,.8,.2,1); transform-origin: left center;
    }
    .mc-sheen { position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(120% 90% at 85% -10%, rgba(91,84,232,.45), transparent 55%),
                  radial-gradient(80% 60% at -10% 110%, rgba(91,84,232,.25), transparent 60%); }
    .mcard.armed .mc-sheen::after { content: ''; position: absolute; inset: 0;
      background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.14) 50%, transparent 60%);
      transform: translateX(-120%); animation: sweep 3.4s 1s ease-in-out infinite; }
    .mc-top { display: flex; justify-content: space-between; align-items: center; }
    .mc-brand { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: .02em; }
    .mc-kind { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .14em; color: #B9BEE8;
      border: 1px solid rgba(255,255,255,.25); border-radius: 4px; padding: 2px 6px; }
    .mc-chip { width: 34px; height: 25px; border-radius: 5px; margin-top: 13px; position: relative;
      background: linear-gradient(135deg, #D8C68A, #B49A55); }
    .mc-chip::after { content: ''; position: absolute; inset: 4px; border: 1px solid rgba(0,0,0,.25); border-radius: 3px; }
    .mc-num { font-family: 'JetBrains Mono', monospace; font-size: 16.5px; letter-spacing: .08em; margin-top: 12px; font-variant-numeric: tabular-nums; }
    .mc-lock { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: .18em; color: #AEB4E4; margin-top: 6px; }
    .mc-bot { margin-top: auto; display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #C9CDF0; }
    .mc-stamp { position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%) rotate(-14deg);
      font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 25px; letter-spacing: .18em;
      padding: 4px 14px; border: 3px double currentColor; border-radius: 6px; color: #FF8896;
      animation: stamp .45s cubic-bezier(.2,1.6,.4,1); }
    .mcard.spent { filter: grayscale(.75); }
    .mcard.spent .mc-stamp { color: #8CE8C8; }
    .mcard.revoked::before { content: ''; position: absolute; inset: 0; z-index: 1;
      background: repeating-linear-gradient(-45deg, transparent 0 14px, rgba(178,58,72,.30) 14px 22px); }
    .mcard.void { opacity: .6; filter: grayscale(.6); }
    .mcard.unminted { opacity: .78; }
    .mcard.unminted .mc-num { color: #7A81B5; }
    @keyframes mint { from { transform: rotateY(70deg) translateX(-12px); opacity: 0; } }
    @keyframes sweep { to { transform: translateX(220%); } }
    @keyframes stamp { from { transform: translate(-50%,-50%) rotate(-14deg) scale(1.8); opacity: 0; } }

    /* hold-to-approve: releasing money has weight */
    .btn-hold { position: relative; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; }
    .btn-hold .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: rgba(91,84,232,.85); }
    .btn-hold .lbl { position: relative; }
    .rstat .exp { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }

    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes openBody { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; }

    @media (max-width: 520px) {
      header { padding: 0 18px; } main { padding: 40px 16px 100px; }
      .approve-inline { padding-left: 18px; }
      .drawer { width: 100vw; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .hero h1, .summary, .search, .row { opacity: 1; }
      .drawer { transition: none; }
    }
  </style>
</head>
<body>
<header>
  <a href="/request" class="brand"><span class="brand-mark">C</span><span class="brand-name">CardGuard</span></a>
  <nav class="nav"><a href="/request">Request</a><a href="/dashboard" class="here">Ledger</a></nav>
</header>

<main>
  <div class="hero">
    <h1>Ledger</h1>
    <div class="summary" id="summary"><span class="dim">Loading…</span></div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search" type="search" placeholder="Search by merchant, purpose, or status" aria-label="Search mandates" />
    </div>
    <div class="err" id="error"></div>
  </div>

  <div class="list" id="list"></div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" tabindex="-1" role="dialog" aria-modal="true" aria-label="Mandate detail">
  <div class="drawer-head" id="drawer-head"></div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<script>
(function(){
  'use strict';

  var usd = function(c){ return '$' + (Math.trunc(Math.abs(c||0))/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); };
  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };

  /* every workflow state -> tint class + human label */
  var STATUS = {
    PENDING_APPROVAL: { c:'s-amber', label:'Pending approval' },
    DRAFT:            { c:'s-iris',  label:'Reviewing' },
    AUTHORIZED:       { c:'s-iris',  label:'Authorized' },
    PROVISIONED:      { c:'s-iris',  label:'Provisioning' },
    EXECUTING:        { c:'s-iris',  label:'Executing' },
    COMPLETED:        { c:'s-green', label:'Completed' },
    FAILED:           { c:'s-red',   label:'Failed' },
    DECLINED:         { c:'s-red',   label:'Declined' },
    REJECTED:         { c:'s-red',   label:'Rejected' },
    REVOKED:          { c:'s-gray',  label:'Revoked' },
    EXPIRED:          { c:'s-gray',  label:'Expired' }
  };
  var stat = function(s){ return STATUS[s] || { c:'s-gray', label:(s||'').replace(/_/g,' ').toLowerCase() }; };
  var LIVE = ['AUTHORIZED','PROVISIONED','EXECUTING'];
  var isLive = function(s){ return LIVE.indexOf(s) !== -1; };
  var DEAD = ['COMPLETED','DECLINED','REJECTED','REVOKED','FAILED','EXPIRED'];
  var isDead = function(s){ return DEAD.indexOf(s) !== -1; };

  function timeAgo(iso){ var s=Math.max(0,Math.round((Date.now()-new Date(iso).getTime())/1000)); if(s<60)return s+'s ago'; if(s<3600)return Math.round(s/60)+'m ago'; if(s<86400)return Math.round(s/3600)+'h ago'; return Math.round(s/86400)+'d ago'; }
  function minsLeft(m){ return Math.max(0, Math.round((new Date(m.scope.expiresAt).getTime()-Date.now())/60000)); }
  function monogram(n){ var t=(n||'').trim(); return t?t[0].toUpperCase():'?'; }

  var els = {
    list: document.getElementById('list'), search: document.getElementById('search'),
    summary: document.getElementById('summary'), error: document.getElementById('error'),
    scrim: document.getElementById('scrim'), drawer: document.getElementById('drawer'),
    dHead: document.getElementById('drawer-head'), dBody: document.getElementById('drawer-body')
  };

  var all = [], searchQ = '', linqLive = false;
  var openId = null, lastFocus = null, lastDrawerKey = '', probeCache = {};

  function fail(m){ els.error.textContent = m; els.error.classList.add('show'); }
  function clearFail(){ els.error.classList.remove('show'); }
  async function api(path, options){ var res = await fetch(path, options); var body = await res.json().catch(function(){ return {}; }); if(!res.ok) throw new Error(body.message || ('Request failed with '+res.status)); return body; }

  /* ==================== compact row ==================== */
  function rowHtml(m){
    var st = stat(m.state);
    var simulated = m.prava.sessionId && String(m.prava.sessionId).indexOf('sim_') === 0;
    var pulse = isLive(m.state) ? ' pulse' : '';
    var expChip = ((m.state==='PENDING_APPROVAL'||isLive(m.state)) && m.scope.expiresAt) ? ' <span class="time exp" data-exp="'+esc(m.scope.expiresAt)+'"></span>' : '';
    var inline = '';
    if(m.state === 'PENDING_APPROVAL'){
      var why = (m.policyReasons && m.policyReasons[0]) || 'Above the amount the agent may spend on its own.';
      inline = '<div class="approve-inline">'
        + '<div class="why">'+esc(why)+'</div>'
        + '<div class="approve-acts">'
          + '<button class="btn btn-go btn-hold" data-act="approve" data-hold data-id="'+m.id+'" aria-label="Approve \u2014 press and hold, or press Enter"><span class="fill"></span><span class="lbl">Hold to approve '+usd(m.amountCents)+'</span></button>'
          + '<button class="btn btn-danger" data-act="decline" data-id="'+m.id+'">Reject</button>'
        + '</div></div>';
    }
    return '<article class="row '+st.c+'" data-id="'+m.id+'" tabindex="0" role="button" aria-label="'+esc(m.scope.merchant)+', '+usd(m.amountCents)+', '+esc(st.label)+'. Open detail.">'
      + '<div class="rhead">'
        + '<div class="mono-tile">'+esc(monogram(m.scope.merchant))+'</div>'
        + '<div class="rmid"><div class="rmerchant">'+esc(m.scope.merchant||'—')+(simulated?'<span class="sim">sim</span>':'')+'</div>'
        + '<div class="rpurpose">'+esc(m.purpose||'—')+(m.seats?' · '+m.seats+' seats':'')+'</div></div>'
        + '<div class="rright"><div class="ramt">'+usd(m.amountCents)+'</div>'
        + '<div class="rstat"><span class="dot'+pulse+'"></span><span class="word">'+esc(st.label)+'</span><span class="time">· '+timeAgo(m.updatedAt)+'</span>'+expChip+'</div></div>'
      + '</div>'
      + inline
    + '</article>';
  }

  /* ==================== drawer sections ==================== */
  function kv(k, v, mono){ return '<div class="kv"><dt>'+esc(k)+'</dt><dd'+(mono?' class="mono"':'')+'>'+v+'</dd></div>'; }

  function agentDecisions(m){
    var dec = m.policyDecision;
    var verdict = dec==='auto_approve' ? '<span class="verdict auto">Auto-approved</span>'
      : (dec==='reject' || m.state==='REJECTED') ? '<span class="verdict stop">Rejected</span>'
      : '<span class="verdict appr">Needs approval</span>';
    var risk = (m.state==='REJECTED'||dec==='reject') ? {l:'high',p:88,t:'HIGH'}
      : (dec==='requires_approval'||m.state==='PENDING_APPROVAL') ? {l:'med',p:55,t:'ELEVATED'}
      : (isDead(m.state)&&m.state!=='COMPLETED') ? {l:'med',p:50,t:'ELEVATED'} : {l:'low',p:22,t:'LOW'};
    var cred = m.prava.cardLast4 ? 'Single-use ···'+esc(m.prava.cardLast4) : (dec==='reject' ? 'None issued' : 'Single-use virtual card');
    return '<div class="sect"><h4>Agent decisions</h4><div class="sect-inner">'
      + kv('Extracted intent', esc(m.purpose||'—'), true)
      + kv('Merchant', esc(m.scope.merchant||'Not identified'))
      + kv('Amount', usd(m.amountCents), true)
      + kv('Policy decision', verdict)
      + kv('Approval reason', esc((m.policyReasons&&m.policyReasons[0])||'—'))
      + kv('Credential', cred, true)
      + kv('Risk assessment', '<div class="risk '+risk.l+'"><div class="risk-bar '+risk.l+'"><i style="width:'+risk.p+'%"></i></div><span class="risk-label">'+risk.t+'</span></div>')
      + '</div></div>';
  }

  function managerApproval(m){
    if(m.state === 'PENDING_APPROVAL'){
      return '<div class="manager"><h5>Your approval</h5><p>Approving issues a single-use card locked to '+esc(m.scope.merchant)+' for '+usd(m.amountCents)+', and nothing else.</p>'
        + '<div class="approve-acts"><button class="btn btn-go btn-hold" data-act="approve" data-hold data-id="'+m.id+'" aria-label="Approve \u2014 press and hold, or press Enter"><span class="fill"></span><span class="lbl">Hold to approve '+usd(m.amountCents)+'</span></button>'
        + '<button class="btn btn-danger" data-act="decline" data-id="'+m.id+'">Reject</button></div></div>';
    }
    var actions = '';
    if(isLive(m.state)) actions = '<div style="margin-top:10px"><button class="btn btn-kill" data-act="revoke" data-id="'+m.id+'">Revoke now</button></div>';
    else if(m.state==='COMPLETED' || m.state==='REVOKED') actions = '<div style="margin-top:10px"><button class="btn btn-ghost" data-probe="'+m.id+'">Try a rogue re-charge</button><div data-probe-out="'+m.id+'">'+(probeCache[m.id]||'')+'</div></div>';
    return '<div class="sect"><h4>Approval chain</h4><div class="sect-inner">'
      + kv('Requested by', esc(m.requesterPhone||'—'))
      + kv('Approver', esc(m.approverPhone||'same as requester'))
      + kv('Authorized by', esc(m.authorizedBy||'not yet'))
      + actions
      + '</div></div>';
  }

  /* the credential as an object: minted, armed, spent, revoked */
  function mcard(m){
    var st = m.state;
    var mode = st==='COMPLETED' ? 'spent'
      : st==='REVOKED' ? 'revoked'
      : (st==='EXPIRED'||st==='DECLINED'||st==='FAILED'||st==='REJECTED') ? 'void'
      : (m.prava.cardLast4 ? 'armed' : 'unminted');
    var stamp = mode==='spent' ? 'SPENT' : mode==='revoked' ? 'REVOKED'
      : mode==='void' ? (st==='EXPIRED' ? 'EXPIRED' : 'VOID') : '';
    var num = m.prava.cardLast4 ? '\u00b7\u00b7\u00b7\u00b7 \u00b7\u00b7\u00b7\u00b7 \u00b7\u00b7\u00b7\u00b7 '+esc(m.prava.cardLast4) : '\u00b7\u00b7\u00b7\u00b7 \u00b7\u00b7\u00b7\u00b7 \u00b7\u00b7\u00b7\u00b7 \u00b7\u00b7\u00b7\u00b7';
    var live = mode==='armed' || st==='PENDING_APPROVAL';
    var right = live && m.scope.expiresAt
      ? '<span data-exp="'+esc(m.scope.expiresAt)+'"></span>'
      : '<span>'+(mode==='spent' ? 'USED 1 OF 1' : mode==='unminted' ? 'NOT YET MINTED' : '\u2014')+'</span>';
    return '<div class="mcard-wrap"><div class="mcard '+mode+'">'
      + '<div class="mc-sheen"></div>'
      + '<div class="mc-top"><span class="mc-brand">CardGuard</span><span class="mc-kind">SINGLE\u00a0USE</span></div>'
      + '<div class="mc-chip"></div>'
      + '<div class="mc-num">'+num+'</div>'
      + '<div class="mc-lock">'+esc((m.scope.merchant||'UNASSIGNED').toUpperCase())+' \u00b7 ONLY</div>'
      + '<div class="mc-bot"><span>CAP '+usd(m.scope.perTransactionCapCents||m.amountCents)+'</span>'+right+'</div>'
      + (stamp ? '<div class="mc-stamp">'+stamp+'</div>' : '')
      + '</div></div>';
  }

  function credential(m){
    var spent = (m.outcome && m.outcome.amountCapturedCents) || 0;
    var cap = m.scope.totalCapCents || m.amountCents || 0;
    var pct = cap>0 ? Math.min(100, Math.round((spent/cap)*100)) : 0;
    var mcls = spent>cap ? 'over' : (m.state==='COMPLETED' ? 'settled' : '');
    var pips=''; for(var i=0;i<Math.min(m.scope.maxUses,8);i++) pips += '<span class="pip'+(i<m.scope.usesConsumed?' spent':'')+'"></span>';
    var dead = isDead(m.state);
    return '<div class="sect"><h4>Credential details</h4><div class="sect-inner">'
      + mcard(m)
      + '<div class="lock">Single-use card · <b>'+esc(m.scope.merchant)+'</b> only, nowhere else</div>'
      + '<div class="meter-row"><span>Spent against this card</span><b>'+usd(spent)+' of '+usd(cap)+'</b></div>'
      + '<div class="meter '+mcls+'"><i style="width:'+pct+'%"></i></div>'
      + kv('Per-charge ceiling', usd(m.scope.perTransactionCapCents), true)
      + kv('Uses', '<span class="pips">'+pips+'</span> &nbsp;'+(m.scope.maxUses-m.scope.usesConsumed)+' of '+m.scope.maxUses+' left')
      + kv(dead?'Closed':'Expires', dead?'—':minsLeft(m)+' min', true)
      + kv('Billing', esc((m.scope.recurrence||'one_time').replace(/_/g,' ')))
      + (m.prava.cardLast4 ? kv('Network token', '···'+esc(m.prava.cardLast4), true) : '')
      + (m.prava.pravaMandateId ? kv('Prava mandate', esc(m.prava.pravaMandateId)+' '+esc(m.prava.pravaMandateStatus||''), true) : '')
      + (m.prava.reportedStatus ? kv('Reported', esc(m.prava.reportedStatus)+(m.prava.visaConfirmation?' · '+esc(m.prava.visaConfirmation):''), true) : '')
      + '</div></div>';
  }

  function policySect(m){
    var reasons = m.policyReasons || [];
    var body = reasons.length ? '<ul class="reasons">'+reasons.map(function(r){ return '<li>'+esc(r)+'</li>'; }).join('')+'</ul>' : '<div class="dim">No policy notes recorded.</div>';
    return '<details class="sect"><summary>Policy <span class="count">'+reasons.length+'</span><span class="caret">▶</span></summary><div class="sect-inner">'+body+'</div></details>';
  }

  function timelineSect(m){
    var KEY=/authorized|provisioned|executing/i, GOOD=/completed|minted|reported|resolved|approved|ok/i, BAD=/reject|declin|revok|fail|expire|refus|undeliver/i;
    var a = m.audit || [];
    if(!a.length) return '';
    var items = a.map(function(x){
      var cls = BAD.test(x.event) ? 'bad' : GOOD.test(x.event) ? 'good' : KEY.test(x.event) ? 'key' : '';
      return '<li class="'+cls+'"><div class="tl-ev">'+esc(x.event)+'</div><div class="tl-meta">'+esc(x.actor)+' · '+timeAgo(x.at)+'</div>'
        + (x.detail?'<div class="tl-detail">'+esc(x.detail)+'</div>':'') + (x.from&&x.to?'<div class="tl-detail">'+esc(x.from)+' → '+esc(x.to)+'</div>':'') + '</li>';
    }).join('');
    return '<details class="sect" open><summary>Timeline <span class="count">'+a.length+'</span><span class="caret">▶</span></summary><div class="sect-inner"><ol class="tl">'+items+'</ol></div></details>';
  }

  function executionSect(m){
    var a = m.audit || [];
    var steps = a.filter(function(x){ return x.actor==='browser-agent' || /^step\.|replay|checkout/i.test(x.event); });
    var gw = m.outcome && m.outcome.gatewayMessage;
    if(!steps.length && !gw) return '<details class="sect"><summary>Execution logs <span class="count">0</span><span class="caret">▶</span></summary><div class="sect-inner"><div class="dim">No checkout has run for this mandate yet.</div></div></details>';
    var lines = steps.map(function(x){
      var ok = /ok|available|completed/i.test(x.event) && !/fail/i.test(x.event);
      return '<div><span class="t">'+esc(new Date(x.at).toTimeString().slice(0,8))+'</span> <span class="'+(ok?'ok':'fail')+'">'+esc(x.event)+'</span> '+esc(x.detail||'')+'</div>';
    }).join('');
    return '<details class="sect"><summary>Execution logs <span class="count">'+steps.length+'</span><span class="caret">▶</span></summary><div class="sect-inner">'
      + (lines?'<div class="loglines">'+lines+'</div>':'')
      + (gw?'<div class="gateway">'+esc(gw)+'</div>':'')
      + '</div></details>';
  }

  function replaySect(m){
    var ev = m.evidence || {};
    var has = ev.replayUrl || (ev.screenshots && ev.screenshots.length);
    var body;
    if(has){
      body = (ev.replayUrl?'<a class="replay-btn" href="'+esc(ev.replayUrl)+'" target="_blank" rel="noopener">Open session replay ↗</a>':'')
        + (ev.screenshots&&ev.screenshots.length?'<div class="shots">'+ev.screenshots.map(function(s){ return '<span class="shot">'+esc(String(s).split('/').pop())+'</span>'; }).join('')+'</div>':'');
    } else {
      body = '<div class="dim">No replay for this purchase. A session replay is captured only when the browser agent runs a live checkout.</div>';
    }
    return '<details class="sect"><summary>Browser replay<span class="caret">▶</span></summary><div class="sect-inner">'+body+'</div></details>';
  }

  function merchantSect(m){
    var ev = m.evidence || {};
    return '<details class="sect"><summary>Merchant details<span class="caret">▶</span></summary><div class="sect-inner">'
      + kv('Merchant', esc(m.scope.merchant||'—'))
      + (ev.merchantUrl?kv('Storefront', esc(ev.merchantUrl), true):'')
      + kv('Category', esc((m.scope.category||'—').replace(/_/g,' ')))
      + (ev.checkoutMode?kv('Checkout mode', esc(ev.checkoutMode), true):'')
      + '</div></details>';
  }

  function metadataSect(m){
    var p = m.prava || {}, ev = m.evidence || {};
    var rows = ''
      + (p.sessionId?kv('Session', esc(p.sessionId), true):'')
      + (p.orderId?kv('Order', esc(p.orderId), true):'')
      + (p.transactionId?kv('Transaction', esc(p.transactionId), true):'')
      + (p.pravaMandateId?kv('Prava mandate', esc(p.pravaMandateId), true):'')
      + (p.pravaMandateStatus?kv('Mandate status', esc(p.pravaMandateStatus), true):'')
      + (p.reportedStatus?kv('Reported status', esc(p.reportedStatus), true):'')
      + (p.visaConfirmation?kv('Visa confirmation', esc(p.visaConfirmation), true):'')
      + (m.outcome&&m.outcome.completedAt?kv('Completed at', esc(new Date(m.outcome.completedAt).toLocaleString()), true):'')
      + kv('Created', esc(new Date(m.createdAt).toLocaleString()), true)
      + kv('Updated', esc(new Date(m.updatedAt).toLocaleString()), true);
    var report = '';
    if(ev.reportRequest || ev.reportResponse){
      report = '<div style="margin-top:12px"><div class="tl-meta" style="margin-bottom:6px">Prava report exchange</div><div class="rawjson">'
        + esc(JSON.stringify({ request: ev.reportRequest, response: ev.reportResponse }, null, 2)) + '</div></div>';
    }
    if(!rows && !report) rows = '<div class="dim">No execution metadata yet.</div>';
    return '<details class="sect"><summary>All execution metadata<span class="caret">▶</span></summary><div class="sect-inner">'+rows+report+'</div></details>';
  }

  function conversationSect(m){
    var msgs = m.messages || [];
    if(!msgs.length) return '';
    var approver = m.approverPhone && m.approverPhone !== m.requesterPhone ? m.approverPhone : null;
    var note = linqLive ? '' : '<div class="sim-note"><span class="tag">simulated</span><span>No Linq token — printed to the server console.</span></div>';
    return '<details class="sect"><summary>Conversation <span class="count">'+msgs.length+'</span><span class="caret">▶</span></summary><div class="sect-inner">'+note+'<div class="thread">'
      + msgs.map(function(x){ var side=(approver&&x.to===approver)?' to-approver':''; return '<div class="msg'+side+'"><div class="msg-meta">'+esc((x.kind||'').replace(/_/g,' '))+' · '+esc(x.to)+' · '+timeAgo(x.at)+'</div><div class="bubble">'+esc(x.body)+'</div></div>'; }).join('')
      + '</div></div></details>';
  }

  function renderDrawer(m){
    var st = stat(m.state);
    var tintVar = { 's-green':'--go', 's-amber':'--limit', 's-iris':'--iris', 's-red':'--stop', 's-gray':'--ink-3' }[st.c];
    els.dHead.innerHTML = '<span class="d-dot" style="background:var('+tintVar+')"></span>'
      + '<span class="d-merchant">'+esc(m.scope.merchant||'—')+'</span>'
      + '<span class="d-state" style="color:var('+tintVar+')">'+esc(st.label)+'</span>'
      + '<span class="d-id">'+esc(m.id)+'</span>'
      + '<button class="d-close" id="dclose" aria-label="Close">✕</button>';
    els.dBody.innerHTML =
        '<div class="d-hero"><span class="d-amt">'+usd(m.amountCents)+'</span><span class="d-cadence">'+esc((m.scope.recurrence||'one_time').replace(/_/g,' '))+(m.seats?' · '+m.seats+' seats':'')+'</span></div>'
      + '<div class="d-purpose">'+esc(m.purpose||'—')+'</div>'
      + managerApproval(m)
      + agentDecisions(m)
      + credential(m)
      + policySect(m)
      + timelineSect(m)
      + executionSect(m)
      + replaySect(m)
      + merchantSect(m)
      + conversationSect(m)
      + metadataSect(m);
    document.getElementById('dclose').addEventListener('click', closeDrawer);
  }

  async function openDrawer(id){
    try {
      var r = await api('/api/mandates/'+encodeURIComponent(id));
      openId = id; lastFocus = document.activeElement; lastDrawerKey = '';
      renderDrawer(r.mandate);
      els.dBody.scrollTop = 0;   // fresh document
      els.scrim.classList.add('open'); els.drawer.classList.add('open');
      els.drawer.focus();
    } catch(err){ fail(err.message); }
  }
  function closeDrawer(){ openId = null; els.scrim.classList.remove('open'); els.drawer.classList.remove('open'); if(lastFocus && lastFocus.focus) lastFocus.focus(); }

  async function refreshDrawer(){
    if(!openId){ lastDrawerKey=''; return; }
    try {
      var m = (await api('/api/mandates/'+encodeURIComponent(openId))).mandate;
      var key = m.id+':'+m.state+':'+m.updatedAt+':'+((m.outcome&&m.outcome.amountCapturedCents)||0)+':'+((m.audit&&m.audit.length)||0);
      if(key !== lastDrawerKey){
        var openDetails = {};
        els.dBody.querySelectorAll('details.sect').forEach(function(d,i){ openDetails[i]=d.open; });
        var st = els.dBody.scrollTop;
        renderDrawer(m);
        els.dBody.querySelectorAll('details.sect').forEach(function(d,i){ if(openDetails[i]!==undefined) d.open=openDetails[i]; });
        els.dBody.scrollTop = st;
        lastDrawerKey = key;
      }
    } catch(e){}
  }

  /* ==================== list render (keyed) ==================== */
  var keyOf = function(m){ return m.id+':'+m.state+':'+m.updatedAt+':'+m.amountCents+':'+((m.outcome&&m.outcome.amountCapturedCents)||0); };
  var lastKey = {};

  function filtered(){
    if(!searchQ) return all;
    var q = searchQ.toLowerCase();
    return all.filter(function(m){ return (m.scope.merchant||'').toLowerCase().indexOf(q)!==-1 || (m.purpose||'').toLowerCase().indexOf(q)!==-1 || stat(m.state).label.toLowerCase().indexOf(q)!==-1; });
  }

  function render(){
    var rows = filtered();
    if(!rows.length){
      els.list.innerHTML = '<div class="empty"><h2>'+(searchQ?'Nothing matches "'+esc(searchQ)+'"':'No mandates yet')+'</h2><p>'+(searchQ?'Try another term.':'Head to the <a href="/request">request page</a> to make one.')+'</p></div>';
      lastKey = {}; return;
    }
    var emptyEl = els.list.querySelector('.empty'); if(emptyEl) emptyEl.remove();
    var seen = {};
    rows.forEach(function(m, idx){
      seen[m.id] = true;
      var key = keyOf(m);
      var existing = els.list.querySelector('[data-id="'+m.id+'"]');
      if(!existing){
        var t = document.createElement('div'); t.innerHTML = rowHtml(m);
        var node = t.firstElementChild; node.style.animationDelay = Math.min(idx*0.03,0.3)+'s';
        els.list.insertBefore(node, els.list.children[idx]||null); lastKey[m.id]=key;
      } else if(lastKey[m.id] !== key){
        var t2 = document.createElement('div'); t2.innerHTML = rowHtml(m);
        els.list.replaceChild(t2.firstElementChild, existing); lastKey[m.id]=key;
      }
      var now = els.list.querySelector('[data-id="'+m.id+'"]');
      if(now && els.list.children[idx] !== now) els.list.insertBefore(now, els.list.children[idx]||null);
    });
    Array.prototype.slice.call(els.list.children).forEach(function(c){ var id=c.getAttribute&&c.getAttribute('data-id'); if(id && !seen[id]){ c.remove(); delete lastKey[id]; } });
  }

  /* ==================== actions ==================== */
  async function doAct(btn){
    var id = btn.getAttribute('data-id'), a = btn.getAttribute('data-act');
    if(a==='revoke' && !confirm('Revoke this card? It stops working immediately, even mid-checkout.')) return;
    btn.disabled = true; var label = btn.textContent; btn.innerHTML = '<span class="spin"></span>';
    try {
      await api('/api/mandates/'+encodeURIComponent(id)+'/'+a, { method:'POST' });
      clearFail();
      await refresh();
      if(openId===id) await refreshDrawer();
    } catch(err){ fail(err.message); btn.disabled=false; btn.textContent=label; }
  }
  async function doProbe(btn){
    var id = btn.getAttribute('data-probe'); btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
    var wrap = els.dBody.querySelector('[data-probe-out="'+id+'"]');
    try {
      var r = await api('/api/mandates/'+encodeURIComponent(id)+'/simulate-second-charge', { method:'POST' });
      var html = '<div class="probe-out '+(r.blocked?'blocked':'ran')+'"><b>'+(r.blocked?'Blocked.':'It went through.')+'</b> '+esc(r.reason)+'</div>';
      probeCache[id]=html; if(wrap) wrap.innerHTML=html;
    } catch(err){ var e='<div class="probe-out ran">'+esc(err.message)+'</div>'; probeCache[id]=e; if(wrap) wrap.innerHTML=e; }
    finally { btn.disabled=false; btn.textContent='Try a rogue re-charge'; }
  }

  /* ==================== events (delegated, CSP-safe) ==================== */
  els.list.addEventListener('click', function(ev){
    var actBtn = ev.target.closest('[data-act]'); if(actBtn){ ev.stopPropagation(); if(actBtn.hasAttribute('data-hold') && ev.detail !== 0){ return; } doAct(actBtn); return; }
    var card = ev.target.closest('.row'); if(!card) return;
    // clicking anywhere else on the card opens the drawer
    openDrawer(card.getAttribute('data-id'));
  });
  els.list.addEventListener('keydown', function(ev){
    if(ev.key!=='Enter' && ev.key!==' ') return;
    if(ev.target.closest('button')) return;
    var card = ev.target.closest('.row'); if(!card) return;
    ev.preventDefault(); openDrawer(card.getAttribute('data-id'));
  });
  els.dBody.addEventListener('click', function(ev){
    var probeBtn = ev.target.closest('[data-probe]'); if(probeBtn){ ev.stopPropagation(); doProbe(probeBtn); return; }
    var actBtn = ev.target.closest('[data-act]'); if(actBtn){ ev.stopPropagation(); if(actBtn.hasAttribute('data-hold') && ev.detail !== 0){ return; } doAct(actBtn); return; }
  });
  els.scrim.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function(ev){ if(ev.key==='Escape' && openId) closeDrawer(); });

  var searchTimer = null;
  els.search.addEventListener('input', function(){ clearTimeout(searchTimer); searchTimer=setTimeout(function(){ searchQ=els.search.value.trim(); render(); }, 120); });

  /* ==================== data ==================== */
  function paintSummary(){
    var pending = all.filter(function(m){ return m.state==='PENDING_APPROVAL'; }).length;
    var monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0,0,0,0);
    var completedThisMonth = all.filter(function(m){
      if(m.state!=='COMPLETED') return false;
      var t = new Date((m.outcome&&m.outcome.completedAt)||m.updatedAt).getTime();
      return t >= monthStart.getTime();
    });
    var settled = completedThisMonth.reduce(function(s,m){ return s + ((m.outcome&&m.outcome.amountCapturedCents)||m.amountCents); }, 0);
    var flag = pending
      ? '<span class="pending-flag"><span class="ring"></span><span class="n">'+pending+'</span> awaiting approval</span>'
      : '<span class="pending-flag clear"><span class="ring"></span>No approvals waiting</span>';
    els.summary.innerHTML = flag
      + '<span class="stat"><b>'+completedThisMonth.length+'</b> '+(completedThisMonth.length===1?'purchase':'purchases')+' this month</span>'
      + '<span class="sep">·</span>'
      + '<span class="stat"><b>'+usd(settled)+'</b> settled this month</span>';
  }

  async function refresh(){
    try {
      var r = await api('/api/mandates?limit=40');
      clearFail();
      all = r.mandates || [];
      paintSummary(); render(); await refreshDrawer();
    } catch(err){ fail(err.message+' — is the server running?'); }
  }
  async function boot(){ try { linqLive = (await api('/ready')).integrations.linq === true; } catch(e){} }


  /* hold-to-approve: 900ms of intent before money is released.
     Pointer users must hold; keyboard users (click with detail 0) act at once. */
  var hold = { btn:null, t0:0, timer:null };
  function holdStart(btn){
    hold.btn = btn; hold.t0 = Date.now();
    var fill = btn.querySelector('.fill');
    hold.timer = setInterval(function(){
      var p = Math.min(1, (Date.now()-hold.t0)/900);
      if(fill) fill.style.width = (p*100)+'%';
      if(p >= 1) holdEnd(true);
    }, 30);
  }
  function holdEnd(fire){
    var btn = hold.btn; if(!btn) return;
    clearInterval(hold.timer); hold.btn = null;
    var fill = btn.querySelector('.fill');
    if(fire){ if(fill) fill.style.width='100%'; doAct(btn); }
    else if(fill){ fill.style.width='0%'; }
  }
  document.addEventListener('pointerdown', function(ev){
    var b = ev.target.closest('[data-hold]');
    if(!b || b.disabled) return;
    ev.preventDefault(); ev.stopPropagation();
    holdStart(b);
  });
  document.addEventListener('pointerup', function(){ holdEnd(false); });
  document.addEventListener('pointercancel', function(){ holdEnd(false); });

  /* authority is time-boxed: every [data-exp] ticks down live */
  function tickExp(){
    var now = Date.now();
    document.querySelectorAll('[data-exp]').forEach(function(el){
      var t = new Date(el.getAttribute('data-exp')).getTime() - now;
      if(isNaN(t)) return;
      if(t <= 0){ el.textContent = '00:00'; return; }
      var sTot = Math.floor(t/1000), mm = Math.floor(sTot/60), ss = sTot%60;
      el.textContent = (mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss+' left';
    });
  }
  setInterval(tickExp, 1000); tickExp();

  boot(); refresh(); setInterval(refresh, 3000);
})();
</script>
</body>
</html>
